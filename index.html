<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SLICBYTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --brand: #021b0a;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #032b12 0%, #010804 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* soft floating background glow */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: var(--brand);
      filter: blur(140px);
      opacity: 0.35;
      animation: float 12s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translate(-40px, -20px);
      }

      50% {
        transform: translate(40px, 20px);
      }

      100% {
        transform: translate(-40px, -20px);
      }
    }

    .container {
      position: relative;
      text-align: center;
      max-width: 640px;
      padding: 48px 32px;
      z-index: 1;
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .coming {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .email {
      display: inline-block;
      margin-top: 8px;
      color: #7dffb5;
      text-decoration: none;
      border-bottom: 1px dashed rgba(125, 255, 181, 0.4);
      transition: opacity 0.2s ease;
    }

    .email:hover {
      opacity: 0.7;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.4;
    }

    /* subtle pulse on the brand */
    .pulse {
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        text-shadow: 0 0 0 rgba(125, 255, 181, 0);
      }

      50% {
        text-shadow: 0 0 18px rgba(125, 255, 181, 0.25);
      }

      100% {
        text-shadow: 0 0 0 rgba(125, 255, 181, 0);
      }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="container">
    <div class="badge">Independent Game Studio</div>

    <h1 class="pulse">SLICBYTE</h1>

    <div class="subtitle">
      Minimal games.<br />
      Smart systems.<br />
      Built with performance in mind.
    </div>

    <div class="coming">
      Coming soon.
    </div>

    <div>
      Contact:
      <a class="email" href="mailto:contact@slicbyte.com">contact@slicbyte.com</a>
    </div>

    <footer>
      © 2026 SLICBYTE
    </footer>
  </div>
</body>


</html>
